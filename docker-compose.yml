services:
  db:
    image: postgres:16-alpine
    container_name: textbridge_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-textbridge_db}
      POSTGRES_USER: ${DB_USER:-textbridge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TextBridgeSecretSecure2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-textbridge_user} -d ${DB_NAME:-textbridge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - textbridge_net

  redis:
    image: redis:7-alpine
    container_name: textbridge_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - textbridge_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: textbridge_web
    restart: always
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-textbridge_db}
      - DB_USER=${DB_USER:-textbridge_user}
      - DB_PASSWORD=${DB_PASSWORD:-TextBridgeSecretSecure2026!}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    networks:
      - textbridge_net

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: textbridge_celery_worker
    restart: always
    command: celery -A config worker -l info --concurrency=4
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-textbridge_db}
      - DB_USER=${DB_USER:-textbridge_user}
      - DB_PASSWORD=${DB_PASSWORD:-TextBridgeSecretSecure2026!}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=True
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    networks:
      - textbridge_net

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: textbridge_celery_beat
    restart: always
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-textbridge_db}
      - DB_USER=${DB_USER:-textbridge_user}
      - DB_PASSWORD=${DB_PASSWORD:-TextBridgeSecretSecure2026!}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=True
    depends_on:
      celery_worker:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - textbridge_net

  nginx:
    image: nginx:alpine
    container_name: textbridge_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/var/www/staticfiles:ro
      - media:/var/www/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
    networks:
      - textbridge_net

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  certbot_conf:
  certbot_www:

networks:
  textbridge_net:
    driver: bridge
